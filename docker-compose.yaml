services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: inbody-db
    environment:
      POSTGRES_DB: inbody
      POSTGRES_USER: inbody
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    container_name: inbody-grafana
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  pgdata:
  grafana_data:
